schema_version: 1

context:
  version: "3.8"

package:
  name: calc
  version: ${{ version }}

source:
  url: https://github.com/epics-modules/calc/archive/refs/tags/R${{ version|replace('.', '-') }}.tar.gz
  sha256: 475a8480de4349eb07d5be6581cbfdbc05dc996dd733e38d5303b12089e9e813

build:
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - make
    - perl
  host:
    - epics-base
  run_exports:
    - ${{ pin_subpackage('calc', upper_bound='x.x.x') }}

tests:
  - package_contents:
      files:
        exists:
          - epics/modules/calc/dbd/calcSupport.dbd
          - epics/modules/calc/dbd/transformRecord.dbd
          - epics/modules/calc/dbd/sCalcoutRecord.dbd
          - epics/modules/calc/dbd/aCalcoutRecord.dbd
          - epics/modules/calc/dbd/sseqRecord.dbd
          - epics/modules/calc/include/sCalcPostfix.h
          - epics/modules/calc/lib/*/libcalc.{dylib,so}
        not_exists:
          - epics/modules/calc/dbd/swaitRecord.dbd
          - epics/modules/calc/dbd/editSseq.dbd

about:
  homepage: https://github.com/epics-modules/calc
  license: EPICS
  license_file: LICENSE
  summary: EPICS module for calculation records (calcout, transform, sseq)
  documentation: https://epics-modules.github.io/calc
  repository: https://github.com/epics-modules/calc

extra:
  recipe-maintainers:
    - simon-ess
    - lucmaga
    - anderslindho
